[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qoptima"
version = "0.2.0"
description = "Hybrid quantum-classical optimisation and quantum-AI (QAOA, gate-level circuits, noise models, quantum kernels) with honest benchmarks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shaswat Mohanty" }]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "networkx>=3.0", "matplotlib>=3.7",
                "scikit-learn>=1.3", "requests>=2.28"]

[project.optional-dependencies]
qiskit = ["qiskit>=1.2", "qiskit-ibm-runtime>=0.30"]
dev = ["pytest>=7"]
data = ["yfinance>=0.2"]
notebook = ["ipywidgets>=8", "jupyter"]

[project.scripts]
qoptima = "qoptima.cli:main"

[tool.setuptools.packages.find]
include = ["qoptima*"]
