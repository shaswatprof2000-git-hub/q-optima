[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qoptima"
version = "0.1.0"
description = "Hybrid quantum-classical optimisation (QAOA, annealing, classical) with honest benchmarks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shaswat Mohanty" }]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[project.optional-dependencies]
qiskit = ["qiskit>=1.2", "qiskit-ibm-runtime>=0.30"]
dev = ["pytest>=7"]

[project.scripts]
qoptima = "qoptima.cli:main"

[tool.setuptools.packages.find]
include = ["qoptima*"]
